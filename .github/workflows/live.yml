name: Live

# Signal of B for tomorrow before the 12:00 day-ahead auction, and settlement of earlier days.
# Primary trigger: an external scheduler (cron-job.org) calls the workflow_dispatch API at
# 10:52 and 11:20 local, and at 18:35 for settlement. GitHub's own cron is best effort; the
# slots below are only a fallback. `strats status` decides cheaply whether a signal is due,
# so duplicate runs do nothing. A signal finished after 11:50 is marked late, never counted.
# The push of signals/YYYY-MM-DD.* and this run's log are the timestamped public record.
on:
  schedule:
    - cron: "50 8 * * *"              # 10:50 CEST
    - cron: "15,35 9 * * *"           # 11:15-11:35 CEST | 10:15-10:35 CET (too early, no-op)
    - cron: "50 9 * * *"              # 10:50 CET
    - cron: "15,35 10 * * *"          # 11:15-11:35 CET
    - cron: "35 16 * * *"             # settlement only
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strats-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Is a signal due?
        id: gate
        # a queued run was created before the previous run pushed: look at the newest state
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          python -m strats status --github-output
      - name: Restore data cache
        if: steps.gate.outputs.due == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 16 * * *'
        uses: actions/cache@v4
        with:
          path: |
            data
            ~/.cache/huggingface
          key: strats-data-${{ github.run_id }}
          restore-keys: strats-data-
      - name: Fetch prices, load, ID-AEP
        if: steps.gate.outputs.due == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 16 * * *'
        run: python -m strats fetch --recent-days 10
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
      - name: Signal for tomorrow
        if: steps.gate.outputs.due == 'true'
        run: python -m strats signal
      - name: Settle earlier signals
        if: steps.gate.outputs.due == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 16 * * *'
        run: python -m strats settle
      - name: Commit
        if: steps.gate.outputs.due == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 16 * * *'
        run: |
          git config user.name "ak16o7"
          git config user.email "akderekaan@hotmail.com"
          for p in signals live README.md; do if [ -e "$p" ]; then git add -A -- "$p"; fi; done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
